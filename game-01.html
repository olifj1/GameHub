<!doctype html>
<html lang="en" class="gh-game-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#e7dbd2">
  <link rel="stylesheet" href="style.css?v=1.8.2">
  <title>Times Tables</title>
</head>
<body class="modular-game" data-game-id="game-01">
  <a class="game-home-button" href="index.html" aria-label="Back to games">← Games</a>
  <button class="game-info-button" type="button" aria-label="How to play" aria-haspopup="dialog">i</button>
  <div class="game-info-overlay" hidden>
    <div class="game-info-dialog" role="dialog" aria-modal="true" aria-labelledby="game-01-info-title">
      <button class="game-info-close" type="button" aria-label="Close instructions">×</button>
      <p class="kicker">HOW TO PLAY</p>
      <h2 id="game-01-info-title">Instructions</h2>
      <p>Choose a times table with the − and + controls. Tap the main button to add one more group each time and watch the multiplication build up. Use Reset to start again.</p>
    </div>
  </div>
  <main class="screen-wrap">
    <section aria-labelledby="numbers-title" class="screen active" id="numbers-screen">
<div class="page numbers-page">
<header class="page-header">
<p class="kicker" data-site-name="">GameHub</p>
<h1 id="numbers-title">Times Tables</h1>
</header>
<div class="numbers-main-content">
<div aria-label="Choose a number" class="number-picker">
<button aria-label="Decrease number" class="round-control" id="number-down">−</button>
<div class="chosen-number" id="chosen-number">4</div>
<button aria-label="Increase number" class="round-control" id="number-up">+</button>
</div>
<div class="total-card">
<div class="total-label">TOTAL</div>
<div class="total-value" id="total-value">0</div>
<div class="equation" id="equation">Tap the button to begin</div>
<div class="multiply-equation" id="multiply-equation"></div>
</div>
<div class="tap-history">
<div aria-hidden="true" class="tap-dots" id="tap-dots"></div>
<div class="tap-count" id="tap-count">0 taps</div>
</div>
<button class="text-button" id="numbers-reset">Reset</button>
</div>
<button aria-label="Add the chosen number" class="tap-button" id="tap-number">
<span class="tap-small">ADD ONE MORE</span>
<span class="tap-big">TAP</span>
</button>
</div>
</section>
  </main>
  <script src="site-config.js?v=1.8.2"></script>
  <script src="core.js?v=1.8.2"></script>
  <script src="game-01.js?v=1.8.2"></script>
</body>
</html>
