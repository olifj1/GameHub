<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#e7dbd2">
  <link rel="stylesheet" href="style.css">
  <title>Real World Maths</title>
</head>
<body class="modular-game" data-game-id="game-05">
  <a class="game-home-button" href="index.html" aria-label="Back to games">← Games</a>
  <button class="game-info-button" type="button" aria-label="How to play" aria-haspopup="dialog">i</button>
  <div class="game-info-overlay" hidden>
    <div class="game-info-dialog" role="dialog" aria-modal="true" aria-labelledby="game-05-info-title">
      <button class="game-info-close" type="button" aria-label="Close instructions">×</button>
      <p class="kicker">HOW TO PLAY</p>
      <h2 id="game-05-info-title">Instructions</h2>
      <p>Choose a category and level, then solve the everyday maths problem. Use the available controls to enter your answer and move on to a new problem when you are ready.</p>
    </div>
  </div>
  <main class="screen-wrap">
    <section class="screen active" id="realmaths-screen"><div class="page realm-page">
<header class="page-header"><p class="kicker" data-site-name="">GameHub</p><h1>Real World Maths</h1></header>
<div class="realm-categories"><button class="realm-category active" data-realm-category="money">💷<span>Money</span></button><button class="realm-category" data-realm-category="cooking">⚖️<span>Cooking</span></button><button class="realm-category" data-realm-category="distance">📏<span>Distance</span></button><button class="realm-category" data-realm-category="time">⏱️<span>Time</span></button></div>
<div class="realm-levels"><button class="realm-level active" data-realm-level="easy">Easy</button><button class="realm-level" data-realm-level="medium">Medium</button><button class="realm-level" data-realm-level="hard">Hard</button></div>
<div class="realm-card"><div class="realm-story" id="realm-story"></div><button class="realm-speak" id="realm-speak">🔊 Read question</button></div>
<div class="realm-question" id="realm-question"></div><div class="realm-answer-row"><input id="realm-answer" inputmode="decimal" placeholder="Your answer"/><span id="realm-unit"></span><button id="realm-check">Check</button></div>
<div class="realm-feedback" id="realm-feedback">Have a go!</div><button class="primary-action" id="realm-new">New Question</button>
</div></section>
  </main>
  <script src="site-config.js"></script>
  <script src="core.js"></script>
  <script src="game-05.js"></script>
</body>
</html>
