<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<body class="modular-game" data-game-id="game-05">
  <a class="game-home-button" href="index.html" aria-label="Back to games">← Games</a>
  <button class="game-info-button" type="button" aria-label="How to play" aria-haspopup="dialog">i</button>
  <div class="game-info-overlay" hidden>
    <div class="game-info-dialog" role="dialog" aria-modal="true" aria-labelledby="game-05-info-title">
      <button class="game-info-close" type="button" aria-label="Close instructions">×</button>
      <p class="kicker">HOW TO PLAY</p>
      <h2 id="game-05-info-title">Instructions</h2>
      <p>Choose a category and level, then solve the everyday maths problem. Use the available controls to enter your answer and move on to a new problem when you are ready.</p>
    </div>
  </div>
  <main class="screen-wrap">
    <section class="screen active" id="realmaths-screen"><div class="page realm-page">
<header class="page-header"><p class="kicker" data-site-name="">GameHub</p><h1>Maths</h1></header>
<div class="realm-categories" aria-label="Maths category">
<button class="realm-category active" data-realm-category="money"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="7" y="12" width="34" height="24" rx="4"/><circle cx="24" cy="24" r="7"/><path d="M12 18c3 0 5-2 5-4M36 30c-3 0-5 2-5 4"/></svg><span>Money</span></button>
<button class="realm-category" data-realm-category="cooking"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 35h30M24 11v24M14 17h20M14 17l-6 12h12l-6-12Zm20 0-6 12h12l-6-12Z"/></svg><span>Cooking</span></button>
<button class="realm-category" data-realm-category="distance"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M9 33 33 9l6 6-24 24-6-6Z"/><path d="m28 14 6 6M23 19l4 4M18 24l6 6M13 29l4 4"/></svg><span>Distance</span></button>
<button class="realm-category" data-realm-category="time"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="26" r="15"/><path d="M24 26V16M24 26l7 5M18 7h12M24 7v4"/></svg><span>Time</span></button>
</div>
<div class="realm-difficulty"><div class="choice-title">Difficulty</div><div class="choice-row difficulty-row"><button class="choice-button active" data-realm-level="easy">Easy</button><button class="choice-button" data-realm-level="medium">Medium</button><button class="choice-button" data-realm-level="hard">Hard</button></div></div>
<div class="realm-card"><div class="realm-story" id="realm-story"></div><div class="realm-question" id="realm-question"></div></div>
<div class="realm-speech-row"><div class="realm-voice-control"><span>Voice</span><select id="realm-voice" aria-label="Voice"></select></div><button class="realm-speak" id="realm-speak"><svg class="speech-icon" viewBox="0 0 32 32" aria-hidden="true"><path class="speech-icon-fill" d="M5.5 13h5.2l6.2-5.1c.9-.7 2.1-.1 2.1 1v14.2c0 1.1-1.2 1.7-2.1 1l-6.2-5.1H5.5A2.5 2.5 0 0 1 3 16.5v-1A2.5 2.5 0 0 1 5.5 13Z"/><path class="speech-icon-line" d="M22.2 12.1c1.2 1 1.8 2.3 1.8 3.9s-.6 2.9-1.8 3.9M25.5 8.8c2.2 1.9 3.5 4.3 3.5 7.2s-1.3 5.3-3.5 7.2"/></svg><span>Read aloud</span></button></div>
<div class="realm-answer-display" id="realm-answer-display" aria-live="polite"></div>
<div aria-label="Answer keypad" class="keypad realm-keypad"><button class="key" data-realm-digit="1">1</button><button class="key" data-realm-digit="2">2</button><button class="key" data-realm-digit="3">3</button><button class="key" data-realm-digit="4">4</button><button class="key" data-realm-digit="5">5</button><button class="key" data-realm-digit="6">6</button><button class="key" data-realm-digit="7">7</button><button class="key" data-realm-digit="8">8</button><button class="key" data-realm-digit="9">9</button><button class="key key-clear" id="realm-clear">⌫</button><button class="key" data-realm-digit="0">0</button><button class="key key-check" id="realm-check">✓</button></div>
<div class="realm-feedback" id="realm-feedback"></div><button class="primary-action" id="realm-new">New Question</button>
</div></section>
  </main>
