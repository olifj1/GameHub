<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#e7dbd2">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css?v=1.5.1">

<body class="modular-home">

    </a>
    <section class="game-grid" id="game-grid" aria-label="Games"></section>
  </main>
  <script src="site-config.js?v=1.5.1"></script>
  <script src="core.js?v=1.5.1"></script>
